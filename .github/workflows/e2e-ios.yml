name: iOS Maestro E2E

on:
  pull_request:
    branches: [develop]
  # Pushes to develop keep a warm native cache: PR caches are only readable by that PR,
  # while caches saved on the base branch are readable by every PR that targets it.
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      clean_cache:
        description: Ignore every native cache and rebuild from scratch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-maestro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Bump the repository variable NATIVE_CACHE_VERSION to invalidate every native cache
  # (bun, CocoaPods, ccache) without a code change.
  CACHE_VERSION: ${{ vars.NATIVE_CACHE_VERSION || 'v1' }}
  # Skip installing git hooks on the runner.
  LEFTHOOK: '0'

jobs:
  maestro:
    runs-on: macos-26
    # The prior cold setup/build used 47 minutes; retain time for every flow, including the large import.
    timeout-minutes: 75
    permissions:
      contents: read
      # Lets the recovery step delete a cache entry that produced a failing build.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Decide how much work this run needs.
      #   run_build=false  the pull request only touches docs, so skip the macOS build.
      #   fresh=true       native inputs changed a lot (lockfile, app config, local modules or
      #                    plugins) or the diff is large, so do not restore a stale fallback cache.
      - name: Plan build and cache use
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          # A pull request compares with its base; a push compares with the previous tip of the branch.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CLEAN_INPUT: ${{ inputs.clean_cache }}
        run: |
          set -euo pipefail
          changed=""
          # An unknown base (new branch, rewritten history, manual run) leaves the list empty, and the
          # planning script then builds.
          if [ "$EVENT" != "workflow_dispatch" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          fi
          echo "Changed files: $(printf '%s\n' "$changed" | grep -c . || true)"
          printf '%s\n' "$changed" | scripts/ci-plan-build.sh | tee -a "$GITHUB_OUTPUT"

      - name: Set up Bun
        if: steps.plan.outputs.run_build == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Cache Bun packages
        if: steps.plan.outputs.run_build == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.CACHE_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.CACHE_VERSION }}-

      # If a restored cache is corrupt, clear it and install again once.
      - name: Install dependencies
        if: steps.plan.outputs.run_build == 'true'
        run: bun install --frozen-lockfile || (bun pm cache rm && bun install --frozen-lockfile)

      - name: Install Maestro 2.10.0
        if: steps.plan.outputs.run_build == 'true'
        run: |
          curl --fail --location --retry 3 --output /tmp/muse-maestro.zip https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip
          echo '29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  /tmp/muse-maestro.zip' | shasum -a 256 --check
          unzip -q /tmp/muse-maestro.zip -d /tmp/muse-maestro
          test -x /tmp/muse-maestro/maestro/bin/maestro
          echo /tmp/muse-maestro/maestro/bin >> "$GITHUB_PATH"

      - name: Install ccache
        if: steps.plan.outputs.run_build == 'true'
        run: brew install ccache

      # The key covers only native inputs, so JavaScript-only changes reuse the exact cache and
      # only re-run the JS bundle. ccache is content-addressed, so a partial restore is safe.
      - name: Cache C++ compilation (ccache)
        if: steps.plan.outputs.run_build == 'true'
        id: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ env.CACHE_VERSION }}-${{ hashFiles('bun.lock', 'app.json', 'eas.json', 'modules/**', 'plugins/**') }}
          restore-keys: ${{ steps.plan.outputs.fresh == 'true' && '' || format('ccache-{0}-{1}-', runner.os, env.CACHE_VERSION) }}

      - name: Cache CocoaPods downloads
        if: steps.plan.outputs.run_build == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ env.CACHE_VERSION }}-${{ hashFiles('bun.lock', 'app.json', 'modules/**') }}
          restore-keys: ${{ steps.plan.outputs.fresh == 'true' && '' || format('pods-{0}-{1}-', runner.os, env.CACHE_VERSION) }}

      # React Native's wrapper needs CCACHE_BINARY in the environment (Xcode does not pass build
      # settings to compile tasks) and ccache must accept Xcode's -ivfsoverlay; see the script.
      - name: Configure ccache
        if: steps.plan.outputs.run_build == 'true'
        run: |
          scripts/ci-ccache-env.sh >> "$GITHUB_ENV"
          ccache --zero-stats

      - name: Test native publication sources
        if: steps.plan.outputs.run_build == 'true'
        run: scripts/test-publication-sources.sh

      - name: Build pinned MuPDF for simulator import tests
        if: steps.plan.outputs.run_build == 'true'
        run: scripts/build-mupdf.sh

      # Booting takes 2 to 3 minutes. Start it here and wait for it after the build, which does not
      # need a running simulator.
      - name: Start iPhone simulator
        if: steps.plan.outputs.run_build == 'true'
        run: |
          DEVICE_ID=$(xcrun simctl create 'Muse E2E' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          xcrun simctl boot "$DEVICE_ID"
          echo "MAESTRO_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      # The pinned MuPDF framework contains an arm64 simulator slice, not x86_64.
      - name: Select arm64 simulator architecture
        if: steps.plan.outputs.run_build == 'true'
        run: |
          printf 'ARCHS = arm64\n' > "$RUNNER_TEMP/muse-sim-arm64.xcconfig"
          echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/muse-sim-arm64.xcconfig" >> "$GITHUB_ENV"

      - name: Build standalone iOS simulator app
        if: steps.plan.outputs.run_build == 'true'
        id: build
        continue-on-error: true
        run: |
          start=$(date +%s)
          trap 'echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"' EXIT
          scripts/build-ios-e2e.sh /tmp/muse-e2e-build

      # Recovery: a failing build after a cache restore may be caused by a stale cache.
      # Delete this cache generation, wipe local build state, and build once from scratch.
      - name: Recover with a clean rebuild
        if: steps.plan.outputs.run_build == 'true' && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "::warning::Build failed with caches restored; clearing native caches and retrying clean."
          ccache --clear || true
          rm -rf ios ~/Library/Developer/Xcode/DerivedData ~/Library/Caches/CocoaPods ~/.ccache
          for prefix in "ccache-${RUNNER_OS}-${CACHE_VERSION}-" "pods-${RUNNER_OS}-${CACHE_VERSION}-"; do
            gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" --json id --jq '.[].id' \
              | xargs -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true
          done
          scripts/build-ios-e2e.sh /tmp/muse-e2e-build

      # Record where the time went so before and after runs can be compared on the ticket, and make a
      # build that bypassed ccache visible instead of silently slow.
      - name: Report build time and ccache statistics
        if: steps.plan.outputs.run_build == 'true' && always()
        run: |
          ccache --show-stats || true
          stats=$(ccache --print-stats 2>/dev/null || true)
          stat() { printf '%s\n' "$stats" | awk -v k="$1" '$1 == k { v = $2 } END { print v + 0 }'; }
          hits=$(( $(stat direct_cache_hit) + $(stat preprocessed_cache_hit) ))
          misses=$(( $(stat cache_miss) ))
          {
            echo "### iOS build"
            echo "- Build step: ${BUILD_SECONDS:-unknown} s"
            echo "- ccache: $hits hits, $misses misses"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $((hits + misses)) -eq 0 ]; then
            echo "::warning::ccache served no compile calls. It is not engaged, so every C++ file was compiled from source."
          fi

      # The simulator started before the build; wait until it is ready to accept the app.
      - name: Wait for iPhone simulator
        if: steps.plan.outputs.run_build == 'true'
        run: xcrun simctl bootstatus "$MAESTRO_DEVICE_ID" -b

      - name: Install app and seed Files fixture
        if: steps.plan.outputs.run_build == 'true'
        run: |
          xcrun simctl install "$MAESTRO_DEVICE_ID" /tmp/muse-e2e-build/Muse.app
          scripts/seed-ios-files-fixture.sh "$MAESTRO_DEVICE_ID"

      - name: Run Maestro flows
        if: steps.plan.outputs.run_build == 'true'
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
        run: |
          status=0
          diagnose() {
            echo "::group::Failure diagnostics (screen hierarchy, then Muse log)"
            maestro --udid "$MAESTRO_DEVICE_ID" hierarchy --compact | head -c 20000 || true
            xcrun simctl spawn "$MAESTRO_DEVICE_ID" log show --last 20m --style compact --predicate 'process == "Muse"' | tail -n 150 || true
            echo "::endgroup::"
          }
          # Seed the large fixture only for its flow: a slow Files provider stays busy with it.
          for flow in .maestro/*.yml; do
            if grep -q '^  - large$' "$flow"; then
              scripts/seed-ios-files-fixture.sh "$MAESTRO_DEVICE_ID" --large
            else
              scripts/seed-ios-files-fixture.sh "$MAESTRO_DEVICE_ID"
            fi
            maestro test --udid "$MAESTRO_DEVICE_ID" "$flow" || { status=1; diagnose; }
          done
          exit "$status"
