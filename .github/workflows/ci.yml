name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check pull request branch flow
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$PR_TITLE" | grep -Eq '^[a-z][a-z0-9-]*(\([a-z0-9-]+\))?!?: .+'; then
            echo "PR title must follow Conventional Commits: type(scope): description"
            exit 1
          fi
          if [[ "$BASE_REF" == "develop" && ( "$HEAD_REF" == feature/* || "$HEAD_REF" == codex/* ) ]]; then exit 0; fi
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" == "develop" ]]; then exit 0; fi
          echo "Feature PRs target develop; only develop targets main."
          exit 1

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run validate
