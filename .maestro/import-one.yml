appId: com.minkgkyaw9899.muse
---
- launchApp:
    clearState: true
- assertVisible: 'Your library is empty'
- tapOn: 'Import PDFs'
- assertVisible: 'Browse'
- tapOn: 'Browse'
- runFlow:
    when:
      notVisible:
        id: 'Muse Import Fixture, pdf'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'DOC.sidebar.item.On My iPhone'
          timeout: 60000
      - tapOn:
          id: 'DOC.sidebar.item.On My iPhone'
          point: '90%,50%'
          retryTapIfNoChange: true
- assertVisible:
    id: 'Muse Import Fixture, pdf'
- runFlow:
    file: helpers/select-file.yml
    env:
      FILE_ID: 'Muse Import Fixture, pdf'
- retry:
    maxRetries: 4
    commands:
      - runFlow:
          when:
            visible: 'Open'
          commands:
            - runFlow: helpers/open-selection.yml
      - extendedWaitUntil:
          visible: 'Muse Import Fixture, 2 pages, imported.*'
          timeout: 30000
- stopApp
- launchApp
- assertVisible: 'Muse Import Fixture, 2 pages, imported.*'
- tapOn: 'Import PDFs'
- tapOn: 'Browse'
- runFlow:
    when:
      notVisible:
        id: 'Muse Import Fixture, pdf'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'DOC.sidebar.item.On My iPhone'
          timeout: 60000
      - tapOn:
          id: 'DOC.sidebar.item.On My iPhone'
          point: '90%,50%'
          retryTapIfNoChange: true
- assertVisible:
    id: 'Muse Import Fixture, pdf'
- runFlow:
    file: helpers/select-file.yml
    env:
      FILE_ID: 'Muse Import Fixture, pdf'
- runFlow:
    file: helpers/open-selection-toast.yml
    env:
      TOAST: '.*Already in Library.*'
- assertVisible: 'Muse Import Fixture, 2 pages, imported.*'

# Search is a separate native iOS 26 tab; it reloads the Library after import.
- tapOn: Search
- tapOn: Search Library
- inputText: mUsE
- assertVisible: 'Muse Import Fixture, 2 pages, imported.*'
- eraseText
- inputText: missing
- assertVisible: No matching publications
- assertNotVisible: 'Muse Import Fixture, 2 pages, imported.*'
- eraseText
- assertVisible: 'Muse Import Fixture, 2 pages, imported.*'
# iOS 26 labels the integrated search dismiss control "Close".
- tapOn: Close
- tapOn: Library
- assertVisible: Import PDFs
