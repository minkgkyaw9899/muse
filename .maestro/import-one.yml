appId: com.minkgkyaw9899.muse
---
- launchApp:
    clearState: true
- assertVisible: 'Your library is empty'
- tapOn: 'Import PDFs'
- assertVisible: 'Browse'
- tapOn: 'Browse'
- runFlow:
    when:
      notVisible:
        id: 'Muse Import Fixture, pdf'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'DOC.sidebar.item.On My iPhone'
          timeout: 60000
      - tapOn:
          id: 'DOC.sidebar.item.On My iPhone'
          point: '90%,50%'
          retryTapIfNoChange: true
- assertVisible:
    id: 'Muse Import Fixture, pdf'
- runFlow:
    file: helpers/select-file.yml
    env:
      FILE_ID: 'Muse Import Fixture, pdf'
- retry:
    maxRetries: 4
    commands:
      - runFlow:
          when:
            visible: 'Open'
          commands:
            - runFlow: helpers/open-selection.yml
      - extendedWaitUntil:
          visible: 'Muse Import Fixture.*was imported.*'
          timeout: 30000
- assertVisible: 'Muse Import Fixture, 2 pages, imported.*'
- stopApp
- launchApp
- assertVisible: 'Muse Import Fixture, 2 pages, imported.*'
- tapOn: 'Import PDFs'
- tapOn: 'Browse'
- runFlow:
    when:
      notVisible:
        id: 'Muse Import Fixture, pdf'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'DOC.sidebar.item.On My iPhone'
          timeout: 60000
      - tapOn:
          id: 'DOC.sidebar.item.On My iPhone'
          point: '90%,50%'
          retryTapIfNoChange: true
- assertVisible:
    id: 'Muse Import Fixture, pdf'
- runFlow:
    file: helpers/select-file.yml
    env:
      FILE_ID: 'Muse Import Fixture, pdf'
- retry:
    maxRetries: 4
    commands:
      - runFlow:
          when:
            visible: 'Open'
          commands:
            - runFlow: helpers/open-selection.yml
      - extendedWaitUntil:
          visible: 'Muse Import Fixture.*Already in Library.*'
          timeout: 30000
- assertVisible: 'Muse Import Fixture, 2 pages, imported.*'
