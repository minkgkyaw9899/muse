appId: com.minkgkyaw9899.muse
---
- launchApp:
    clearState: true
- assertVisible: 'Your library is empty'
- tapOn: 'Import PDFs'
- tapOn: 'Browse'
- runFlow:
    when:
      notVisible:
        id: 'Muse Import Fixture, pdf'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'DOC.sidebar.item.On My iPhone'
          timeout: 60000
      - tapOn:
          id: 'DOC.sidebar.item.On My iPhone'
          point: '90%,50%'
          retryTapIfNoChange: true
- runFlow:
    file: helpers/select-file.yml
    env:
      FILE_ID: 'Muse Import Fixture, pdf'
- runFlow:
    file: helpers/select-file.yml
    env:
      FILE_ID: 'Muse Duplicate Fixture, pdf'
- runFlow:
    file: helpers/select-file.yml
    env:
      FILE_ID: 'Muse Damaged Fixture, pdf'
# One toast summarizes the batch: one copy imports, its identical twin is a duplicate, one is damaged.
- runFlow:
    file: helpers/open-selection-toast.yml
    env:
      TOAST: 'Imported 1, 1 already in Library, 1 failed.*Choose another copy.*'
- assertVisible: 'Muse .*Fixture, 2 pages, imported.*'
- stopApp
- launchApp
- assertVisible: 'Muse .*Fixture, 2 pages, imported.*'
- assertNotVisible: 'Muse Damaged Fixture, 2 pages, imported.*'
