appId: com.minkgkyaw9899.muse
---
- launchApp:
    clearState: true
- assertVisible: 'Your library is empty'
- tapOn: 'Import PDFs'
- tapOn: 'Browse'
- runFlow:
    when:
      notVisible:
        id: 'Muse Import Fixture, pdf'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'DOC.sidebar.item.On My iPhone'
          timeout: 60000
      - tapOn:
          id: 'DOC.sidebar.item.On My iPhone'
          point: '90%,50%'
          retryTapIfNoChange: true
- runFlow:
    file: helpers/select-file.yml
    env:
      FILE_ID: 'Muse Import Fixture, pdf'
- runFlow:
    file: helpers/select-file.yml
    env:
      FILE_ID: 'Muse Duplicate Fixture, pdf'
- runFlow:
    file: helpers/select-file.yml
    env:
      FILE_ID: 'Muse Damaged Fixture, pdf'
- runFlow: helpers/open-selection.yml
- extendedWaitUntil:
    visible: 'Import finished.*'
    timeout: 30000
- assertVisible: 'Muse Damaged Fixture.*Choose another copy.*'
- assertVisible: '.*Already in Library.*'
- assertVisible: '.*was imported.*'
- scrollUntilVisible:
    element: 'Muse .*Fixture, 2 pages, imported.*'
    direction: DOWN
- stopApp
- launchApp
- assertVisible: 'Muse .*Fixture, 2 pages, imported.*'
- assertNotVisible: 'Muse Damaged Fixture, 2 pages, imported.*'
