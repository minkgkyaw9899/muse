appId: com.minkgkyaw9899.muse
tags:
  - large
---
- launchApp:
    clearState: true
- assertVisible: 'Your library is empty'
- tapOn: 'Import PDFs'
- tapOn: 'Browse'
- runFlow:
    when:
      notVisible:
        id: 'Muse Import Fixture, pdf'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'DOC.sidebar.item.On My iPhone'
          timeout: 60000
      - tapOn:
          id: 'DOC.sidebar.item.On My iPhone'
          point: '90%,50%'
          retryTapIfNoChange: true
- runFlow:
    file: helpers/select-file.yml
    env:
      FILE_ID: 'Muse Import Fixture, pdf'
- runFlow:
    file: helpers/select-file.yml
    env:
      FILE_ID: 'Muse Large Fixture, pdf'
- runFlow: helpers/open-selection.yml
- extendedWaitUntil:
    visible: '1 of 2 files completed'
    timeout: 120000
# Keep progress readable across supported iPhone widths instead of a narrow column beside Cancel.
- assertVisible:
    text: '1 of 2 files completed'
    width: 330
    tolerance: 48
- tapOn: 'Cancel import'
- extendedWaitUntil:
    visible: 'Import cancelled.*'
    timeout: 60000
- assertVisible: 'Muse Large Fixture.*Cancelled.*'
- scrollUntilVisible:
    element: 'Muse Import Fixture, 2 pages, imported.*'
    direction: DOWN
- stopApp
- launchApp
- assertVisible: 'Muse Import Fixture, 2 pages, imported.*'
- assertNotVisible: 'Muse Large Fixture, 100 pages, imported.*'
